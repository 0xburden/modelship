server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mutable discovery only: the script itself contains immutable version URLs.
    location = /latest/install.sh {
        default_type application/x-sh;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Do not expose mutable binary/checksum URLs or a directory listing.
    location /latest/ {
        add_header Cache-Control "no-store, max-age=0" always;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
